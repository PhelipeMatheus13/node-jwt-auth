components:
    examples:
        InvalidCredentials:
            summary: Invalid email or password
            value:
                success: false
                error:
                    code: "INVALID_CREDENTIALS"
                    message: "Invalid email or password"
        AccessTokenExpired:
            summary: Access token expired
            value:
                success: false
                error:
                    code: "ACCESS_TOKEN_EXPIRED"
                    message: "Access token expired"
        RefreshTokenExpired:
            summary: Refresh token expired
            value:
                success: false
                error:
                    code: "REFRESH_TOKEN_EXPIRED"
                    message: "Refresh token expired"
        InvalidRefreshToken:
            summary: Malformed or tampered refresh token
            value:
                success: false
                error:
                    code: "INVALID_TOKEN"
                    message: "Invalid refresh token"
        InvalidAccessToken:
            summary: Malformed or tampered access token
            value:
                success: false
                error:
                    code: "INVALID_TOKEN"
                    message: "Invalid access token"
        TokenNotFound:
            summary: Token not found in database
            value:
                success: false
                error:
                    code: "TOKEN_NOT_FOUND"
                    message: "Refresh token not found"
        TokenReuseDetected:
            summary: Refresh token reuse detected, all sessions revoked
            value:
                success: false
                error:
                    code: "TOKEN_REUSE_DETECTED"
                    message: "Refresh token reuse detected"