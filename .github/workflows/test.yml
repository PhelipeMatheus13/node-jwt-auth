name: Test

on:  
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          SECRET: ${{ secrets.SECRET }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
          RETENTION_HOURS_TOKEN_REVOKED: ${{ secrets.RETENTION_HOURS_TOKEN_REVOKED }}
          TOKEN_CLEANUP_INTERVAL_MS: ${{ secrets.TOKEN_CLEANUP_INTERVAL_MS }}

  test-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          SECRET: ${{ secrets.SECRET }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
          RETENTION_HOURS_TOKEN_REVOKED: ${{ secrets.RETENTION_HOURS_TOKEN_REVOKED }}
          TOKEN_CLEANUP_INTERVAL_MS:  ${{ secrets.TOKEN_CLEANUP_INTERVAL_MS }}